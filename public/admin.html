<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন প্যানেল</title><link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script src="/common.js"></script></head><body>
<div id="lg" class="login"><form id="lf" class="box"><h2>🔐 অ্যাডমিন লগইন</h2><input type="password" id="pw" class="inp" placeholder="পাসওয়ার্ড" required><button class="btn pri">লগইন</button><p id="le" class="err"></p></form></div>
<div id="ap" hidden>
<header class="top"><div class="wrap bar"><span class="logo">⚙️ অ্যাডমিন প্যানেল</span><a class="ib" href="/" target="_blank" style="margin-left:auto">সাইট দেখুন ↗</a><button class="ib" id="theme">🌙</button><button class="ib" id="lo">লগআউট</button></div></header>
<div class="wrap" style="padding-top:16px">
<div class="tools"><button class="btn pri" id="nw">＋ নতুন চাকরি</button><input id="as" class="inp" placeholder="খুঁজুন…" style="max-width:240px"><span id="cnt"></span></div>
<div class="tw"><table class="tb"><thead><tr><th>#</th><th>শিরোনাম</th><th>ক্যাটাগরি</th><th>শেষ তারিখ</th><th>স্ট্যাটাস</th><th>ভিউ</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<nav id="pg" class="pager"></nav></div>
<dialog id="dg"><form id="jf" class="dp"><h2 id="dt" style="margin:0"></h2>
<div class="fg" id="ff"></div>
<div class="fg"><label class="fl"><span><input type="checkbox" id="ur"> 🚨 জরুরি বিজ্ঞপ্তি</span></label><label class="fl"><span><input type="checkbox" id="ft"> ⭐ ফিচার্ড (হাইলাইট)</span></label></div>
<div class="fl">কভার/লোগো ছবি<input type="file" id="cvf" accept="image/*"><div class="th2" id="cvp"></div></div>
<div class="fl">সার্কুলারের ছবি (একাধিক দেওয়া যাবে)<input type="file" id="cif" accept="image/*" multiple><div class="th2" id="cip"></div></div>
<label class="fl">বিস্তারিত বিবরণ<textarea class="inp" name="description"></textarea></label>
<label class="fl">আবেদনের নিয়ম<textarea class="inp" name="how_to_apply"></textarea></label>
<p id="fe" class="err"></p>
<div class="act"><button class="btn pri" id="sb">💾 সেভ করুন</button><button type="button" class="btn" id="cn">বাতিল</button></div></form></dialog></div>
<script>
let tok=sessionStorage.getItem('tok')||'',page=1,eid=0,cover='',circ=[];
const A=(u,m='GET',b)=>api(u,{method:m,headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).catch(e=>{if(e.message==='unauthorized')logout();throw e});
function logout(){sessionStorage.removeItem('tok');tok='';$('#ap').hidden=true;$('#lg').hidden=false}
async function shrink(f){if(f.size<8e5)return f;const b=await createImageBitmap(f),k=Math.min(1,2200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(x=>r(new File([x],'a.jpg',{type:'image/jpeg'})),'image/jpeg',.88))}
async function up(f){const fd=new FormData();fd.append('file',await shrink(f));const r=await fetch('/api/admin/upload',{method:'POST',headers:{authorization:'Bearer '+tok},body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error);return j.url}
const FLD=[['title','পদ/বিজ্ঞপ্তির শিরোনাম *','text','full'],['org','প্রতিষ্ঠানের নাম','text'],['category','ক্যাটাগরি *','cat'],['vacancies','পদসংখ্যা (যেমন: ৫০ জন)','text'],['location','কর্মস্থল','text'],['salary','বেতন','text'],['education','শিক্ষাগত যোগ্যতা','text'],['experience','অভিজ্ঞতা','text'],['age_limit','বয়সসীমা','text'],['deadline','আবেদনের শেষ তারিখ','date'],['apply_url','আবেদনের লিংক (https://…)','url','full'],['status','স্ট্যাটাস','status']];
$('#ff').innerHTML=FLD.map(([k,l,t,f])=>`<label class="${f||''}">${l}`+(t==='cat'?`<select class="inp" name="${k}">${CATS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select>`:t==='status'?`<select class="inp" name="${k}"><option value="published">প্রকাশিত</option><option value="draft">ড্রাফট (লুকানো)</option></select>`:`<input class="inp" type="${t}" name="${k}">`)+'</label>').join('');
function thumbs(){$('#cvp').innerHTML=cover?`<div><img src="${esc(cover)}"><button type="button" data-x="c">✕</button></div>`:'';$('#cip').innerHTML=circ.map((s,i)=>`<div><img src="${esc(s)}"><button type="button" data-x="${i}">✕</button></div>`).join('')}
$('#dg').addEventListener('click',e=>{const x=e.target.dataset?.x;if(x==null)return;if(x==='c')cover='';else circ.splice(+x,1);thumbs()});
$('#cvf').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#fe').textContent='⏳ আপলোড হচ্ছে…';try{cover=await up(f);$('#fe').textContent=''}catch(x){$('#fe').textContent=x.message}e.target.value='';thumbs()};
$('#cif').onchange=async e=>{$('#fe').textContent='⏳ আপলোড হচ্ছে…';try{for(const f of e.target.files)circ.push(await up(f));$('#fe').textContent=''}catch(x){$('#fe').textContent=x.message}e.target.value='';thumbs()};
function openForm(j){eid=j?.id||0;$('#dt').textContent=eid?'✏️ চাকরি এডিট (#'+bn(eid)+')':'➕ নতুন চাকরি';$('#jf').reset();$('#fe').textContent='';
 if(j){for(const el of $('#jf').elements)if(el.name&&j[el.name]!=null)el.value=j[el.name];$('#ur').checked=!!j.urgent;$('#ft').checked=!!j.featured}
 cover=j?.image_url||'';circ=[...(j?.circular_images||[])];thumbs();$('#dg').showModal()}
$('#nw').onclick=()=>openForm();$('#cn').onclick=()=>$('#dg').close();
$('#jf').onsubmit=async e=>{e.preventDefault();const o={};new FormData($('#jf')).forEach((v,k)=>o[k]=v);Object.assign(o,{featured:$('#ft').checked,urgent:$('#ur').checked,image_url:cover,circular_images:circ});
 $('#sb').disabled=true;try{eid?await A('/api/admin/jobs/'+eid,'PUT',o):await A('/api/admin/jobs','POST',o);$('#dg').close();load()}catch(x){$('#fe').textContent=x.message}$('#sb').disabled=false};
async function load(){const p=new URLSearchParams({page,limit:20});if($('#as').value)p.set('q',$('#as').value);
 try{const r=await A('/api/admin/jobs?'+p);$('#cnt').textContent='মোট '+bn(r.total)+'টি';
 $('#tb').innerHTML=r.items.map(j=>`<tr><td>${bn(j.id)}</td><td><a href="/job?id=${j.id}" target="_blank"><b>${esc(j.title)}</b></a><br><small class="org">${esc(j.org)}</small></td><td>${catOf(j.category)[1]}</td><td class="${left(j.deadline).cls}">${bnDate(j.deadline)}</td><td>${j.status==='draft'?'📝 ড্রাফট':'✅ প্রকাশিত'}</td><td>${bn(j.views)}</td><td style="white-space:nowrap"><button class="btn" data-e="${j.id}">✏️</button> <button class="btn red" data-d="${j.id}">🗑️</button></td></tr>`).join('')||'<tr><td colspan="7">কিছু নেই</td></tr>';
 let h='';if(r.pages>1)h=`<button ${page<2?'disabled':''} data-p="${page-1}">‹</button><small style="width:auto">${bn(page)} / ${bn(r.pages)}</small><button ${page>=r.pages?'disabled':''} data-p="${page+1}">›</button>`;$('#pg').innerHTML=h}catch(e){}}
$('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.e)openForm(await A('/api/admin/jobs/'+b.dataset.e));
 if(b.dataset.d&&confirm('সত্যিই মুছে ফেলবেন?')){await A('/api/admin/jobs/'+b.dataset.d,'DELETE');load()}};
$('#pg').onclick=e=>{const b=e.target.closest('button[data-p]');if(b&&!b.disabled){page=+b.dataset.p;load()}};
let t;$('#as').oninput=()=>{clearTimeout(t);t=setTimeout(()=>{page=1;load()},350)};
$('#lo').onclick=logout;
function enter(){$('#lg').hidden=true;$('#ap').hidden=false;load()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';try{const r=await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});tok=r.token;sessionStorage.setItem('tok',tok);enter()}catch(x){$('#le').textContent=x.message}};
if(tok)enter();
</script></body></html>
